# Compiles the Apple apps (iPhone/iPad, Mac, Apple TV) on every change under apps/apple.
# Unsigned build check only; signing + TestFlight happen on Colin's Mac.
name: Apple apps build

on:
  push:
    branches: [main, "claude/**"]
    paths: ["apps/apple/**", "js/**", "index.html", ".github/workflows/apple.yml"]
  pull_request:
    paths: ["apps/apple/**", ".github/workflows/apple.yml"]
  workflow_dispatch:
    inputs:
      duo:
        description: "iPhone Duo check: build with the newest Xcode 27 and the DUO_SDK code turned on"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: EarthMIDI_iOS
            dest: generic/platform=iOS Simulator
          - scheme: EarthMIDI_macOS
            dest: generic/platform=macOS
          - scheme: EarthMIDITV
            dest: generic/platform=tvOS Simulator
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Xcode version
        run: |
          # Normal runs: Xcode 16 compile check. Manual "duo" runs: newest Xcode 27 (iOS 27.1+ SDK) if the runner has one.
          if [ "${{ inputs.duo }}" = "true" ]; then X="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)"; [ -n "$X" ] || { echo "::error::No Xcode 27 on this runner yet"; exit 1; }
          else X="$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"; fi
          sudo xcode-select -s "$X" || true
          xcodebuild -version
      - name: Generate project
        working-directory: apps/apple
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate
      - name: Build ${{ matrix.scheme }}
        working-directory: apps/apple
        run: |
          set -o pipefail
          xcodebuild build -project EarthMIDI.xcodeproj -scheme "${{ matrix.scheme }}" -destination "${{ matrix.dest }}" \
            -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ${{ inputs.duo && 'OTHER_SWIFT_FLAGS=-DDUO_SDK' || '' }} \
            | tee build.log | grep -E "error:|warning: .*(deprecated|never|unused)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Errors
        if: failure()
        working-directory: apps/apple
        run: |
          grep -E "^/.*: error:" build.log | sed "s#.*/apps/apple/##" | sort -u | head -120 || true
