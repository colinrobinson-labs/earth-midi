# Deploys earthmidi.com and refreshes the live data snapshot.
# Runs on every push to main, on demand, and every ~10 minutes: GitHub throttles the schedule below to every few hours,
# so .github/workflows/keeper.yml starts this workflow every 10 minutes instead.
# Needs Settings → Pages → Source set to "GitHub Actions". Until then every step after the
# check is skipped and the site keeps serving from the branch as before.
name: Deploy site + live data

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: read # lets the deploy wait until GitHub lists the uploaded site package
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer run waits instead of cancelling one mid-deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # Until Pages is switched to "GitHub Actions", skip quietly so the schedule doesn't send failure emails
      - name: Check Pages source
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "Pages build type: $mode"
          echo "ready=$([ "$mode" = workflow ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.mode.outputs.ready == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.mode.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Copy site files
        if: steps.mode.outputs.ready == 'true'
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/scripts _site/docs _site/tests _site/apps
          rm -f _site/BACKLOG.md _site/README.md

      - name: Minify the home page
        if: steps.mode.outputs.ready == 'true'
        # never blocks the deploy: if esbuild can't be installed or the step fails, the page ships as separate files
        continue-on-error: true
        timeout-minutes: 2
        # exact esbuild version from scripts/package-lock.json
        run: |
          (cd scripts && npm ci --no-audit --no-fund)
          node scripts/minify.mjs _site

      - name: Fingerprint scripts and styles
        if: steps.mode.outputs.ready == 'true'
        run: node scripts/stamp.mjs _site

      - name: Fetch live data snapshot
        if: steps.mode.outputs.ready == 'true'
        # never blocks the deploy: on any failure the page calls the sources itself
        continue-on-error: true
        timeout-minutes: 4
        # Weather switch (docs/weatherkit.md): repo variable WEATHER_SOURCE=weatherkit moves weather + city temps to
        # Apple WeatherKit. Off (Open-Meteo) when unset. The key stays here in Actions; browsers and apps never see it.
        env:
          WEATHER_SOURCE: ${{ vars.WEATHER_SOURCE }}
          WEATHERKIT_TEAM_ID: ${{ vars.WEATHERKIT_TEAM_ID }}
          WEATHERKIT_KEY: ${{ secrets.WEATHERKIT_KEY }}
          WEATHERKIT_KEY_ID: ${{ secrets.WEATHERKIT_KEY_ID }}
          WEATHERKIT_SERVICE_ID: ${{ secrets.WEATHERKIT_SERVICE_ID }}
        run: node scripts/snapshot.mjs _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.mode.outputs.ready == 'true'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.mode.outputs.ready == 'true'
        with:
          path: _site

      # Why this wait exists: deploy-pages looks up the uploaded package once, about a second after the upload.
      # Since ~Nov 19 2026 GitHub's artifact list often lags that long, so about 1 deploy in 3 failed with
      # "No artifacts named github-pages" (or, rarely, "Multiple artifacts") even though the upload worked.
      # Wait until GitHub lists exactly one package for this run (up to ~90 s) before deploying.
      - name: Wait until the upload is listed
        if: steps.mode.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" --jq .total_count 2>/dev/null || echo "?")
            if [ "$n" = 1 ]; then echo "Listed after ${i} check(s)."; sleep 3; exit 0; fi
            echo "Check $i: GitHub lists $n package(s), waiting"; sleep 3
          done
          echo "::warning::GitHub still doesn't list the upload; deploying anyway (the retry below covers it)."

      - id: deployment
        if: steps.mode.outputs.ready == 'true'
        # a failed first try only means GitHub wasn't ready; the retry below decides whether the run fails
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Pause before retrying
        if: steps.mode.outputs.ready == 'true' && steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::First deploy try failed; trying once more in 45 seconds."
          sleep 45

      - id: deployment_retry
        if: steps.mode.outputs.ready == 'true' && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
