# Deploys earthmidi.com and refreshes the live data snapshot.
# Runs on every push to main, on demand, and every ~10 minutes: GitHub throttles the schedule below to every few hours,
# so .github/workflows/keeper.yml starts this workflow every 10 minutes instead.
# Needs Settings → Pages → Source set to "GitHub Actions". Until then every step after the
# check is skipped and the site keeps serving from the branch as before.
name: Deploy site + live data

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer run waits instead of cancelling one mid-deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Until Pages is switched to "GitHub Actions", skip quietly so the schedule doesn't send failure emails
      - name: Check Pages source
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "Pages build type: $mode"
          echo "ready=$([ "$mode" = workflow ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4.2.2
        if: steps.mode.outputs.ready == 'true'

      - uses: actions/setup-node@v7.1.0
        if: steps.mode.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Copy site files
        if: steps.mode.outputs.ready == 'true'
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/scripts _site/docs _site/tests _site/apps

      - name: Fingerprint scripts and styles
        if: steps.mode.outputs.ready == 'true'
        run: node scripts/stamp.mjs _site

      - name: Fetch live data snapshot
        if: steps.mode.outputs.ready == 'true'
        # never blocks the deploy: on any failure the page calls the sources itself
        continue-on-error: true
        timeout-minutes: 4
        # Weather switch (docs/weatherkit.md): repo variable WEATHER_SOURCE=weatherkit moves weather + city temps to
        # Apple WeatherKit. Off (Open-Meteo) when unset. The key stays here in Actions; browsers and apps never see it.
        env:
          WEATHER_SOURCE: ${{ vars.WEATHER_SOURCE }}
          WEATHERKIT_TEAM_ID: ${{ vars.WEATHERKIT_TEAM_ID }}
          WEATHERKIT_KEY: ${{ secrets.WEATHERKIT_KEY }}
          WEATHERKIT_KEY_ID: ${{ secrets.WEATHERKIT_KEY_ID }}
          WEATHERKIT_SERVICE_ID: ${{ secrets.WEATHERKIT_SERVICE_ID }}
        run: node scripts/snapshot.mjs _site

      - uses: actions/configure-pages@v5.0.0
        if: steps.mode.outputs.ready == 'true'

      - uses: actions/upload-pages-artifact@v3.0.1
        if: steps.mode.outputs.ready == 'true'
        with:
          path: _site

      - id: deployment
        if: steps.mode.outputs.ready == 'true'
        uses: actions/deploy-pages@v4.0.5
