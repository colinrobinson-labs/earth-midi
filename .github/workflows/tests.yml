# Fast checks that need no browser: lint, the "same reading, same note" table, and the offline tests for the
# live-data snapshot job, the health report and the weather switch. Runs on every pull request and work-branch push.
name: Tests

on:
  pull_request:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["apps/apple/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Unit tests
        run: node --test "tests/*.test.mjs"
      - name: Lint
        run: |
          (cd tests && PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci)
          tests/node_modules/.bin/eslint -c tests/eslint.config.mjs .
