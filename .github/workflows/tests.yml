# Fast checks that need no browser: lint, the "same reading, same note" table, and the offline tests for the
# live-data snapshot job, the health report and the weather switch. Runs on every pull request and work-branch push.
name: Tests

on:
  pull_request:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["apps/apple/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Unit tests
        run: node --test "tests/*.test.mjs"
      - name: Lint
        run: |
          npm i --no-save --no-audit --no-fund eslint@10.1.0 @eslint/js@10.0.1 globals@17.14.0
          npx eslint -c tests/eslint.config.mjs .
