# Opens every page on a phone and a desktop in a real browser, presses Play, and fails on script errors
# or serious accessibility problems, then feeds it junk share links and files and fails if any of it gets through. Runs on every pull request and every push to a work branch.
name: Site check

on:
  pull_request:
  push:
    branches: ["claude/**"]
    paths-ignore: ["apps/apple/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Syntax check
        run: for f in js/*.js sw.js scripts/*.mjs tests/*.mjs; do node --check "$f" || exit 1; done
      - name: WeatherKit switch (offline)
        run: node tests/weatherkit.test.mjs
      - name: Install browser (exact versions from tests/package-lock.json)
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install the minifier (exact version from scripts/package-lock.json)
        working-directory: scripts
        run: npm ci
      # two copies: _site is what the deploy publishes (home page minified by scripts/minify.mjs),
      # _plain is the site as it is in the repo, which is what the Apple apps bundle and what ships if minifying ever fails
      - name: Build the site like the deploy does
        run: |
          mkdir _site && git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/scripts _site/docs _site/tests _site/apps
          cp -r _site _plain
          node scripts/minify.mjs _site
          grep -q '<script defer src="js/core.js"' _site/index.html || { echo "The home page was not minified"; exit 1; }
          node scripts/stamp.mjs _site
          node scripts/stamp.mjs _plain
      - name: Smoke test (as deployed)
        run: |
          (cd _site && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 1
          node tests/smoke.mjs
          node tests/keyboard-offline.mjs
          node tests/panels.mjs
          node tests/midi-ports.mjs
      - name: Hostile input test (as deployed)
        run: node tests/hostile.mjs
      - name: Smoke test (as in the repo)
        run: |
          (cd _plain && python3 -m http.server 8766 >/dev/null 2>&1 &)
          sleep 1
          SITE=http://localhost:8766/ node tests/smoke.mjs
      - name: Hostile input test (as in the repo)
        run: SITE=http://localhost:8766/ node tests/hostile.mjs
