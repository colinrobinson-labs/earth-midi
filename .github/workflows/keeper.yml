# Keeps the live data snapshot fresh. GitHub runs scheduled workflows only every few hours when it's busy,
# so this one long run starts "Deploy site + live data" every 10 minutes for almost six hours, then starts
# its own successor. The hourly schedule is only a backstop: GitHub fires it every 5 to 8 hours in practice,
# which used to leave gaps of up to two and a half hours with no data refresh. It also checks the published snapshot and
# opens a GitHub issue (which emails the repo owner) when data stops updating, then closes it once data is back.
name: Keep live data fresh

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

# one keeper at a time; a second one waits in line and starts the moment this one ends
concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Refresh every 10 minutes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          end=$(( $(date +%s) + 345*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            gh workflow run pages.yml --repo "$REPO" --ref main || echo "dispatch failed, trying again next round"
            sleep 300
            node scripts/health.mjs > health.txt || true
            if [ -s health.txt ]; then
              echo "::warning::$(head -1 health.txt)"
              n=$(gh issue list --repo "$REPO" --label data-alert --state open --json number --jq '.[0].number' || true)
              if [ -z "$n" ]; then
                gh label create data-alert --repo "$REPO" --color d93f0b --description "Live data stopped updating" 2>/dev/null || true
                gh issue create --repo "$REPO" --label data-alert --title "Live data stopped updating" --body-file health.txt || true
              fi
            else
              for n in $(gh issue list --repo "$REPO" --label data-alert --state open --json number --jq '.[].number' || true); do
                gh issue close "$n" --repo "$REPO" --comment "Data is updating again ($(date -u +%H:%M) UTC). Closed automatically." || true
              done
            fi
            sleep 300
          done
      # Hand over. The new run waits in the "keeper" line until this one finishes, so there is no gap and never two at once.
      # Runs after a failure too, so one bad run can't end the chain. Cancelling a run by hand does stop it.
      - name: Start the next keeper
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # if the schedule already queued one, it is next in line: don't queue a second (that would cancel the first)
          waiting=$(gh run list --repo "$REPO" --workflow keeper.yml --limit 10 --json status --jq '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")] | length' || echo 0)
          if [ "${waiting:-0}" -gt 0 ]; then echo "A keeper is already waiting in line."; exit 0; fi
          for try in 1 2 3; do
            gh workflow run keeper.yml --repo "$REPO" --ref main && exit 0
            sleep 20
          done
          echo "::warning::Could not start the next keeper. The hourly schedule will pick it up."
